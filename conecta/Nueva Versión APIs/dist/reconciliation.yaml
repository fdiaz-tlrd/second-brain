openapi: 3.0.3
info:
  title: Reconciliation API — Panama Interoperability HUB
  version: 1.1.0-draft
  description: |
    Reconciliation cycle exchange (daily calendar-day cycle, 7×365). The cycle is governed by
    the HUB calendar: the HUB determines the end of the operating day,
    closes the cycle, runs the batch reconciliation engine and emits the
    `RECONCILIATION_FILE_AVAILABLE` event; participants do not push cycle records. The file is
    retrieved as a **physical file through a short-lived secure URL** (no file payload inside
    an API response), respecting the exchange security rules; SFTP remains as a bounded
    compatibility channel. The participant then acknowledges the cycle and reports
    discrepancies through this API.
    Errors use `application/problem+json` with a `reasonCode` from the HUB error code catalogue.
  contact:
    name: Panama Interoperability HUB — Developer Support
    email: hub-support@hub.example.pa
  license:
    name: Proprietary
    url: https://hub.example.pa/terms
servers:
  - url: https://sandbox.hub.example.pa/reconciliation/v1
    description: Sandbox
  - url: https://hub.example.pa/reconciliation/v1
    description: Production
tags:
  - name: Files
    description: Cycle file download and acknowledgement
paths:
  /files/{cycleDate}:
    parameters:
      - name: cycleDate
        in: path
        required: true
        description: Calendar day of the reconciliation cycle (ISO 8601 date).
        schema:
          type: string
          format: date
    get:
      tags:
        - Files
      summary: Obtain the secure download reference of the cycle file
      description: |
        Returns the download descriptor of the file filtered to the authenticated participant's
        scope (master file = net positions; format based on recon.001). The response carries a
        **short-lived secure URL** to retrieve the physical file — the file content never
        travels inside the API payload.
      operationId: getReconciliationFile
      security:
        - oauth2ClientCredentials:
            - reconciliation.read
      responses:
        '200':
          description: Download descriptor of the cycle file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationFileDescriptor'
              examples:
                ready:
                  value:
                    cycleDate: '2026-09-16'
                    downloadUrl: https://files.hub.example.pa/reconciliation/2026-09-16/TELERED?sig=eyJhbGciOi...
                    expiresAt: '2026-09-17T06:00:00Z'
                    fileHash: 3f8a1c0d9e7b6a5f4e3d2c1b0a998877665544332211ffeeddccbbaa00112233
                    sizeBytes: 1048576
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/{cycleDate}/ack:
    parameters:
      - name: cycleDate
        in: path
        required: true
        description: Calendar day of the reconciliation cycle (ISO 8601 date).
        schema:
          type: string
          format: date
    post:
      tags:
        - Files
      summary: Acknowledge the cycle file and report discrepancies
      operationId: acknowledgeReconciliationFile
      security:
        - oauth2ClientCredentials:
            - reconciliation.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/JwsSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationAck'
            examples:
              withDiscrepancies:
                summary: ACK reporting one amount mismatch
                value:
                  status: DISCREPANCIES_REPORTED
                  fileHash: 3f8a1c0d9e7b6a5f4e3d2c1b0a998877665544332211ffeeddccbbaa00112233
                  discrepancies:
                    - transactionId: HUB-TX-77213
                      discrepancyType: AMOUNT_MISMATCH
                      expected: '125.00'
                      observed: '12.50'
                      comment: Decimal shift in cycle file
      responses:
        '200':
          description: Acknowledgement registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationAckReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The cycle was already acknowledged by this participant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: |
        OAuth 2.0 Client Credentials over mTLS, conforming to the FAPI 2.0 Security Profile.
        Access tokens are sender-constrained using certificate-bound access tokens as defined
        by RFC 8705. Authorization scopes use the `domain.action` convention. Payload signing
        requirements are defined by the `x-jws-signature` parameter.
      flows:
        clientCredentials:
          tokenUrl: https://auth.hub.example.pa/oauth2/token
          scopes:
            directory.resolve: Resolve person keys (aliases)
            directory.read: Read networks and account-name verification
            merchants.resolve: Resolve merchants (transactional QR path)
            merchants.read: Read and search merchants
            merchants.write: Register and maintain merchants and collection methods
            payments.write: Create payment orders
            payments.read: Read payment status
            collections.write: Create collection requests (Request-to-Pay)
            collections.read: Read collection requests
            events.manage: Manage event subscriptions
            operations.read: Read system notifications and operational status
            operations.write: Participant session (Sign On/Off) and inbound operational events
            operations.admin: Scheme-operator actions (restricted to the HUB operator)
            reconciliation.read: Download reconciliation files
            reconciliation.write: Acknowledge reconciliation files and report discrepancies
  schemas:
    ReconciliationFileDescriptor:
      type: object
      required:
        - cycleDate
        - downloadUrl
        - expiresAt
        - fileHash
        - sizeBytes
      properties:
        cycleDate:
          type: string
          format: date
          example: '2026-09-16'
        downloadUrl:
          type: string
          format: uri
          description: Short-lived secure URL to retrieve the physical file (scoped to the authenticated participant).
        expiresAt:
          type: string
          format: date-time
          description: Expiry of the secure URL.
        fileHash:
          type: string
          description: SHA-256 of the file, to confirm integrity after download.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          example: 1048576
    DiscrepancyType:
      type: string
      enum:
        - MISSING_TRANSACTION
        - UNEXPECTED_TRANSACTION
        - AMOUNT_MISMATCH
        - STATUS_MISMATCH
        - DUPLICATE
    Discrepancy:
      type: object
      required:
        - transactionId
        - discrepancyType
      properties:
        transactionId:
          type: string
        discrepancyType:
          $ref: '#/components/schemas/DiscrepancyType'
        expected:
          type: string
          description: Canonical expected value. Amounts use decimal notation with two decimal places; statuses use their API enum value; counts use base-10 integers.
        observed:
          type: string
          description: Canonical value observed in the HUB file, using the same representation as `expected`.
        comment:
          type: string
    ReconciliationAck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ACCEPTED
            - DISCREPANCIES_REPORTED
        fileHash:
          type: string
          description: SHA-256 of the downloaded file, for integrity confirmation.
        discrepancies:
          type: array
          items:
            $ref: '#/components/schemas/Discrepancy'
    ReconciliationAckReceipt:
      type: object
      required:
        - ackId
        - cycleDate
        - status
        - receivedAt
      properties:
        ackId:
          type: string
        cycleDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACCEPTED
            - DISCREPANCIES_REPORTED
        receivedAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: |
        RFC 7807 error. `reasonCode` carries the HUB numeric error code (families: 1xxx directory,
        3xxx business rejection, 4xxx timeout); `isoReasonCode` carries the ISO 20022 External
        Code Set value when one applies (e.g. AM04, AC06, FRAD, DUPL).
      required:
        - title
        - status
        - reasonCode
      properties:
        type:
          type: string
          format: uri
          example: https://hub.example.pa/problems/business-rule
        title:
          type: string
          example: Business rule rejected
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: The given MCC is not registered in the master catalogue.
        reasonCode:
          type: string
          description: HUB error code (families 1xxx/3xxx/4xxx).
          example: '3001'
        isoReasonCode:
          type: string
          description: ISO 20022 External Code Set reason, when applicable.
          example: AM04
        traceId:
          type: string
          description: Correlation with the HUB telemetry.
  responses:
    Unauthorized:
      description: Not authenticated (invalid token or mTLS certificate not presented)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (missing scope or participant not entitled)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid request (syntax or schema)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Idempotency key (UUID) for safe retries (same key, same result).
      schema:
        type: string
        format: uuid
    JwsSignature:
      name: x-jws-signature
      in: header
      required: true
      description: |
        Detached JWS signature of the exact request body, using compact serialization with an
        unencoded payload (`b64=false`) as defined by RFC 7515 and RFC 7797. The protected
        header must contain `alg`, `kid`, `b64:false` and `crit:["b64"]`. Algorithms are
        restricted to PS256 or ES256; `none` and symmetric algorithms are forbidden. `kid`
        identifies an active signing key registered for the authenticated participant. Key
        publication and rotation use the participant metadata registered during onboarding.
      schema:
        type: string
        minLength: 1
